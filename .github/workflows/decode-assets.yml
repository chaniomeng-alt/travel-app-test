name: Decode binary assets
on:
  push:
    paths:
      - 'assets/_b64/**'
      - '.github/workflows/decode-assets.yml'
  workflow_dispatch:
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode .b64 into PNG
        run: |
          set -e
          shopt -s nullglob globstar
          count=0
          for f in assets/_b64/**/*.b64; do
            rel="${f#assets/_b64/}"
            out="assets/${rel%.b64}"
            mkdir -p "$(dirname "$out")"
            base64 -d "$f" > "$out"
            echo "decoded $f -> $out ($(wc -c < "$out") bytes)"
            count=$((count+1))
          done
          echo "decoded_count=$count"
          test "$count" -gt 0
      - name: Commit decoded PNGs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets/covers assets/stickers assets/stickers/pets assets/shop assets/decor
          git add assets/covers assets/stickers assets/stickers/pets assets/shop assets/decor
          if git diff --staged --quiet; then
            echo "No PNG changes"
            exit 0
          fi
          git commit -m "Add decoded cover, sticker, shop, and decor PNGs"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push failed, rebase retry $i"
            git pull --rebase origin main
          done
          exit 1
